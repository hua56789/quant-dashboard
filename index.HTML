<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端适配关键 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a"/>
    <link rel="manifest" href="manifest.json">
    <title>量化分析仪表盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        panel: '#1e293b',
                        primary: '#38bdf8',
                        buy: '#22c55e',
                        sell: '#ef4444',
                        textMuted: '#94a3b8'
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding:0; box-sizing: border-box; }
        body { background-color:#0f172a; color:#e2e8f0; overflow:hidden; }
        .scrollbar-thin::-webkit-scrollbar { width:4px;height:4px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background:#475569;border-radius:4px; }
        .event-scroll { animation: scroll 22s linear infinite; }
        @keyframes scroll { 0% {transform: translateX(100%);} 100% {transform: translateX(-100%);} }
        /* 移动端响应式 */
        @media (max-width:768px) {
            .row-horizontal { flex-direction:column !important; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// 模拟分时数据
function genTimeShareData() {
    const arr = [];
    let price = 10.25;
    for(let i=0;i<240;i++){
        price += (Math.random()-0.48)*0.06;
        arr.push([i, price, Math.floor(Math.random()*1200)]);
    }
    return arr;
}
// 模拟K线数据
function genKlineData() {
    const list = [];
    let close = 10.2;
    for(let i=0;i<180;i++){
        const open = close + (Math.random()-0.5)*0.22;
        const high = Math.max(open,close)+Math.random()*0.35;
        const low = Math.min(open,close)-Math.random()*0.35;
        close = low + Math.random()*(high-low);
        list.push([`2025-0${Math.floor(i/30)+1}-${String(i%28+1).padStart(2,'0')}`,open,close,low,high,Math.floor(Math.random()*18000)]);
    }
    return list;
}

// 财经事件
const newsList = [
    "【宏观】央行公开市场投放280亿流动性",
    "【行业】电力板块业绩预告集中披露",
    "【个股】大唐电力上调年度分红预期",
    "【外围】美股能源板块收盘走强",
    "【风险】部分小盘股减持公告发布",
    "【数据】PMI数据小幅回升，内需改善"
];

function QuantDashboard() {
    const [stockCode, setStockCode] = useState("601991");
    const [timeShare, setTimeShare] = useState(genTimeShareData());
    const [klineData, setKlineData] = useState(genKlineData());
    const [params, setParams] = useState({maShort:5,maLong:20,stopLoss:2.5,takeProfit:5.2});
    const [logList, setLogList] = useState(["系统就绪，等待策略生成..."]);
    const [signal, setSignal] = useState({winRate:62.3,odds:1.87,risk:0.32,pos:0.45,vol:12600});
    const [showReport, setShowReport] = useState(false);
    const [animPlay, setAnimPlay] = useState(false);
    const [animIdx, setAnimIdx] = useState(0);
    const tsRef = useRef(null);
    const kRef = useRef(null);

    const addLog = (msg)=> setLogList(p=>[...p.slice(-25),`[${new Date().toLocaleTimeString()}] ${msg}`]);

    // 分时图
    useEffect(()=>{
        if(!tsRef.current) return;
        const chart = echarts.init(tsRef.current);
        const x = timeShare.map((v,i)=>i);
        const p = timeShare.map(v=>v[1]);
        const vol = timeShare.map(v=>v[2]);
        const avg = Array(p.length).fill(p.reduce((a,b)=>a+b,0)/p.length);
        const opt = {
            backgroundColor:'transparent',
            tooltip:{trigger:'axis'},
            grid:{left:40,right:20,top:30,bottom:60},
            xAxis:{type:'category',data:x,axisLine:{lineStyle:{color:'#475569'}}},
            yAxis:[
                {type:'value',scale:true,axisLine:{lineStyle:{color:'#475569'}}},
                {type:'value',gridIndex:1,axisLine:{show:false}}
            ],
            axisPointer:{link:[{xAxisIndex:'all'}]},
            series:[
                {name:'现价',type:'line',data:p,lineStyle:{color:'#38bdf8',width:2},itemStyle:{color:'#38bdf8'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(56,189,248,0.25)'},{offset:1,color:'rgba(56,189,248,0)'}]}}},
                {name:'均价',type:'line',data:avg,lineStyle:{color:'#f59e0b',width:1,type:'dashed'}},
                {name:'成交量',type:'bar',yAxisIndex:1,data:vol,itemStyle:{color:function(params){return p[params.dataIndex]>=avg[params.dataIndex]?'#22c55e':'#ef4444'}}}
            ]
        };
        chart.setOption(opt);
        return ()=>chart.dispose();
    },[timeShare]);

    // K线图
    useEffect(()=>{
        if(!kRef.current) return;
        const chart = echarts.init(kRef.current);
        const sliceData = klineData.slice(0, animPlay ? animIdx : klineData.length);
        const cat = sliceData.map(i=>i[0]);
        const kl = sliceData.map(i=>[i[1],i[2],i[3],i[4]]);
        const vol = sliceData.map(i=>i[5]);
        const marks = [];
        sliceData.forEach((row,idx)=>{
            if(idx>15 && idx%27===0) marks.push({type:'buy',xAxis:cat[idx],yAxis:row[2]});
            if(idx>32 && idx%41===0) marks.push({type:'sell',xAxis:cat[idx],yAxis:row[2]});
        })
        const opt = {
            backgroundColor:'transparent',
            tooltip:{trigger:'axis'},
            grid:[{left:50,right:20,top:20,height:'60%'},{left:50,right:20,top:'70%',height:'20%'}],
            xAxis:[{type:'category',data:cat,axisLine:{lineStyle:{color:'#475569'}}},{gridIndex:1,type:'category',data:cat,axisLabel:{show:false}}],
            yAxis:[{scale:true,axisLine:{lineStyle:{color:'#475569'}}},{gridIndex:1,type:'value',axisLine:{show:false}}],
            series:[
                {name:'K线',type:'candlestick',data:kl,itemStyle:{color:'#22c55e',color0:'#ef4444',borderColor:'#22c55e',borderColor0:'#ef4444'}},
                {name:'买卖标记',type:'scatter',data:marks.map(m=>({name:m.type,value:[m.xAxis,m.yAxis],symbolSize:12,symbol:m.type==='buy'?'triangle':'invertedTriangle',itemStyle:{color:m.type==='buy'?'#22c55e':'#ef4444'}}))},
                {name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vol,itemStyle:{color:function(params){const d=kl[params.dataIndex];return d[1]<=d[2]?'#22c55e':'#ef4444'}}}
            ]
        };
        chart.setOption(opt);
        return ()=>chart.dispose();
    },[klineData,animIdx,animPlay]);

    useEffect(()=>{
        if(!animPlay) return;
        if(animIdx >= klineData.length){ setAnimPlay(false); return; }
        const timer = setTimeout(()=>setAnimIdx(p=>p+1),120);
        return ()=>clearTimeout(timer);
    },[animPlay,animIdx,klineData.length]);

    const runStrategy = ()=>{
        addLog(`开始生成策略，参数：短期MA${params.maShort}，长期MA${params.maLong}，止损${params.stopLoss}%，止盈${params.takeProfit}%`);
        setTimeout(()=>{
            addLog("策略引擎完成回测，胜率62.3%，盈亏比1.87");
            setShowReport(true);
        },1200);
    };
    const selectStock = ()=>{
        addLog(`选股：${stockCode}，拉取行情数据`);
        setTimeShare(genTimeShareData());
        setKlineData(genKlineData());
        setAnimIdx(0);
    }

    return (
        <div className="w-screen h-screen flex flex-col p-3 gap-3">
            <header className="text-center">
                <h1 className="text-3xl font-bold text-primary">量化分析仪表盘</h1>
            </header>
            {/* 第一行 */}
            <div className="flex flex-1 gap-3 row-horizontal">
                <div className="flex-[0.7] bg-panel rounded-lg p-2 flex flex-col">
                    <div className="text-sm mb-2 text-slate-300">实时分时走势</div>
                    <div ref={tsRef} className="flex-grow w-full"></div>
                    <div className="mt-2 bg-dark py-1 overflow-hidden rounded">
                        <div className="event-scroll whitespace-nowrap text-sm text-textMuted">
                            {newsList.join(" ｜ ")}
                        </div>
                    </div>
                </div>
                <div className="flex-[0.3] bg-panel rounded-lg p-3">
                    <h3 className="text-lg mb-3 text-primary">量化信号面板</h3>
                    <div className="grid grid-cols-2 gap-2">
                        <div className="bg-dark p-2 rounded"><div className="text-textMuted text-xs">成交量</div><div className="text-xl">{signal.vol}</div></div>
                        <div className="bg-dark p-2 rounded"><div className="text-textMuted text-xs">综合评分</div><div className="text-xl">76</div></div>
                        <div className="bg-dark p-2 rounded"><div className="text-textMuted text-xs">胜率</div><div className="text-xl text-buy">{signal.winRate}%</div></div>
                        <div className="bg-dark p-2 rounded"><div className="text-textMuted text-xs">盈亏赔率</div><div className="text-xl">{signal.odds}</div></div>
                        <div className="bg-dark p-2 rounded"><div className="text-textMuted text-xs">风险系数</div><div className="text-xl text-sell">{signal.risk}</div></div>
                        <div className="bg-dark p-2 rounded"><div className="text-textMuted text-xs">建议仓位</div><div className="text-xl">{(signal.pos*100).toFixed(0)}%</div></div>
                    </div>
                </div>
            </div>
            {/* 第二行 */}
            <div className="flex flex-1 gap-3 row-horizontal">
                <div className="flex-[0.6] bg-panel rounded-lg p-3">
                    <h3 className="text-lg mb-3 text-primary">策略生成引擎</h3>
                    <div className="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <label className="text-textMuted text-xs">短期均线</label>
                            <input className="w-full bg-dark p-2 rounded mt-1 outline-primary" value={params.maShort} onChange={e=>setParams({...params,maShort:Number(e.target.value)})}/>
                        </div>
                        <div>
                            <label className="text-textMuted text-xs">长期均线</label>
                            <input className="w-full bg-dark p-2 rounded mt-1 outline-primary" value={params.maLong} onChange={e=>setParams({...params,maLong:Number(e.target.value)})}/>
                        </div>
                        <div>
                            <label className="text-textMuted text-xs">止损 %</label>
                            <input className="w-full bg-dark p-2 rounded mt-1 outline-primary" value={params.stopLoss} onChange={e=>setParams({...params,stopLoss:Number(e.target.value)})}/>
                        </div>
                        <div>
                            <label className="text-textMuted text-xs">止盈 %</label>
                            <input className="w-full bg-dark p-2 rounded mt-1 outline-primary" value={params.takeProfit} onChange={e=>setParams({...params,takeProfit:Number(e.target.value)})}/>
                        </div>
                    </div>
                    <div className="flex gap-2 mb-3">
                        <button onClick={runStrategy} className="bg-primary px-3 py-2 rounded text-dark font-bold">AI生成策略 & 回测</button>
                        <button onClick={()=>setShowReport(true)} className="bg-slate-600 px-3 py-2 rounded">多策略对比</button>
                    </div>
                    <div className="flex gap-2 items-center">
                        <input value={stockCode} onChange={e=>setStockCode(e.target.value)} className="bg-dark p-2 rounded flex-1" placeholder="股票代码"/>
                        <button onClick={selectStock} className="bg-buy px-3 py-2 rounded">选股加载</button>
                    </div>
                    {showReport && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                        <div className="bg-panel p-4 w-[500px] max-w-[90vw] rounded-lg">
                            <h2 className="text-xl text-primary mb-3">回测报告</h2>
                            <p>策略：双均线趋势策略</p>
                            <p>总收益：+28.7%</p>
                            <p>最大回撤：-11.4%</p>
                            <p>交易次数：42次</p>
                            <p>胜率：62.3%，盈亏比1.87</p>
                            <p className="mt-2 text-textMuted">对比：基准指数+16.2%</p>
                            <button onClick={()=>setShowReport(false)} className="mt-4 bg-slate-600 px-3 py-2 rounded">关闭</button>
                        </div>
                    </div>}
                </div>
                <div className="flex-[0.4] bg-panel rounded-lg p-3 flex flex-col">
                    <div className="flex justify-between flex-wrap gap-2">
                        <h3 className="text-primary">系统日志流</h3>
                        <span className="text-sm text-textMuted">多空指示器：近期上涨12天 / 下跌8天 → 偏多</span>
                    </div>
                    <div className="mt-2 flex-grow overflow-y-auto scrollbar-thin bg-dark rounded p-2 text-sm font-mono">
                        {logList.map((item,i)=><div key={i} className="mb-1">{item}</div>)}
                    </div>
                </div>
            </div>
            {/* 第三行 全宽K线 */}
            <div className="flex-1 bg-panel rounded-lg p-2 flex flex-col">
                <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
                    <span className="text-primary">日线K线回测图</span>
                    <div className="flex gap-2">
                        <button onClick={()=>{setAnimIdx(0);setAnimPlay(true);}} className="bg-primary px-3 py-1 rounded text-dark">▶ 逐K动画播放</button>
                        <button onClick={()=>{setAnimPlay(false);setAnimIdx(klineData.length);}} className="bg-slate-600 px-3 py-1 rounded">重置</button>
                    </div>
                </div>
                <div ref={kRef} className="flex-grow w-full"></div>
            </div>
        </div>
    )
}
ReactDOM.createRoot(document.getElementById('root')).render(<QuantDashboard/>);
</script>
</body>
</html>
